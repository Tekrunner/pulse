visuals:
  - id: world-population-path
    contract: 1.0.0
    dataset: world-demography-indicators
    question: world-population-path
    query: world-indicators
    schema: world-population-schema
    columns: [period, series_kind, population_thousands, population_growth_rate_pct]
  - id: country-population-paths
    contract: 1.0.0
    dataset: world-demography-indicators
    question: country-population-path
    query: country-population
    schema: country-population-schema
    columns: [period, location_id, location_name, series_kind, population_thousands, population_growth_rate_pct]
  - id: change-composition
    contract: 1.0.0
    dataset: world-demography-indicators
    question: population-change-composition
    query: country-components
    schema: change-composition-schema
    columns: [period, location_id, location_name, series_kind, population_change_thousands, natural_change_thousands, natural_change_rate_per_1000, net_migration_thousands, net_migration_rate_per_1000]
  - id: migration-flows
    contract: 1.0.0
    dataset: world-demography-indicators
    question: gross-migration-flows
    query: country-net-migration
    schema: migration-spine-schema
    columns: [period, location_id, location_name, iso3_code, net_migration_thousands]
  - id: fertility-longevity
    contract: 1.0.0
    dataset: world-demography-indicators
    question: fertility-and-longevity
    query: country-longevity
    schema: longevity-schema
    columns: [period, location_id, location_name, iso3_code, series_kind, total_fertility_rate, life_expectancy_years]
  - id: age-structure
    contract: 1.0.0
    dataset: world-demography-age-structure
    question: age-structure
    query: age-bands
    schema: age-structure-schema
    columns: [location_id, location_name, age_grouping, age_group, age_start, age_end, population_male_thousands, population_female_thousands, population_total_thousands, share_of_population_pct]

# Every column any declared query reads, including the secondary queries no
# slot references. Public closure and privacy resolve against this list, so a
# column read but not declared here would be a lineage claim that is no longer
# true.
lineage:
  world-demography-indicators:
    - period
    - location_id
    - location_name
    - location_kind
    - iso3_code
    - series_kind
    - population_thousands
    - population_growth_rate_pct
    - population_change_thousands
    - natural_change_thousands
    - natural_change_rate_per_1000
    - net_migration_thousands
    - net_migration_rate_per_1000
    - total_fertility_rate
    - life_expectancy_years
  world-demography-scenarios:
    - period
    - location_id
    - location_kind
    - scenario
    - scenario_kind
    - population_thousands
  world-demography-age-structure:
    - period
    - location_id
    - location_name
    - age_grouping
    - age_group
    - age_start
    - age_end
    - population_male_thousands
    - population_female_thousands
    - population_total_thousands
    - share_of_population_pct
  european-immigration-flows:
    - period
    - iso3_code
    - immigration_persons
  european-emigration-flows:
    - period
    - iso3_code
    - emigration_persons
  healthy-life-expectancy:
    - period
    - iso3_code
    - sex
    - healthy_life_expectancy_years

state_topology:
  report: [ready, loading, empty, query-error, engine-error]
  slot: [ready, loading, empty, suspect, stale, query-error, schema-error, render-error, engine-error]
  failure_scope: slot-local
  retry: safe

exploration:
  enabled: true
  default_period: all
  controls: [represented-period, observation-year, countries, projection-scenario, change-unit]

change:
  version: 1.0.0
  summary: Initial world demography report declaration
