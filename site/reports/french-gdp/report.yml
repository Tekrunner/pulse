  - id: income-share-panels
    contract: 1.0.0
    dataset: french-national-accounts-annual
    question: income-split
    query: income-shares
    schema: income-shares-schema
    columns: [period, gdp_current_eur_mn, adjusted_labour_income_eur_mn, adjusted_capital_income_eur_mn, net_taxes_on_production_eur_mn, net_taxes_on_products_eur_mn, unadjusted_wage_share_pct]
  - id: dollar-decomposition
    contract: 1.0.0
    dataset: french-gdp-dollar-decomposition
    question: dollar-output
    query: dollar-gdp
    schema: dollar-gdp-schema
    columns: [period, gdp_current_usd_mn, gdp_constant_usd_mn, constant_usd_base_year, eur_per_usd, dollar_gdp_change_pct, dollar_gdp_change_log_points, real_growth_log_points, deflator_change_log_points, exchange_rate_change_log_points]
  - id: oecd-standing
    contract: 1.0.0
    dataset: oecd-productivity-comparison
    question: international-standing
    query: oecd-standing
    schema: oecd-standing-schema
    columns: [period, reference_area_code, reference_area_name, reference_area_kind, gdp_per_capita_ppp_current_usd, gdp_per_capita_ppp_constant_2020_usd, gdp_volume_growth_pct]
  - id: per-capita-drivers
    contract: 1.0.0
    dataset: oecd-productivity-comparison
    question: per-capita-drivers
    query: productivity-drivers
    schema: productivity-drivers-schema
    columns: [period, reference_area_code, reference_area_name, reference_area_kind, gdp_per_capita_ppp_current_usd, gdp_per_capita_ppp_constant_2020_usd, gdp_per_hour_ppp_current_usd, gdp_per_hour_ppp_constant_2020_usd, hours_per_worker, employment_per_capita, labour_input_is_plausible]
  - id: index-choropleth
    contract: 1.0.0
    dataset: french-departement-geometry
    question: territorial-spread
    query: departement-geometry
    schema: departement-geometry-schema
    columns: [departement_code, departement_name, region_code, geometry_geojson, bbox_west, bbox_south, bbox_east, bbox_north]
lineage:
  french-national-accounts-annual: [period, gdp_chained_2020_eur_mn, gdp_volume_growth_pct, gdp_per_capita_chained_2020_eur, contribution_household_consumption_pt, contribution_npish_consumption_pt, contribution_government_consumption_pt, contribution_gfcf_pt, contribution_inventories_pt, contribution_valuables_pt, contribution_net_trade_pt, gdp_current_eur_mn, adjusted_labour_income_eur_mn, adjusted_capital_income_eur_mn, net_taxes_on_production_eur_mn, net_taxes_on_products_eur_mn, unadjusted_wage_share_pct]
  french-gdp-quarterly: [period, gdp_chained_annualised_eur_mn, gdp_quarterly_growth_pct, gdp_year_on_year_growth_pct]
  french-branch-value-added: [period, level, branch_code, branch_label, parent_code, is_residual, share_of_total_value_added_pct]
  french-gdp-dollar-decomposition: [period, gdp_current_usd_mn, gdp_constant_usd_mn, constant_usd_base_year, eur_per_usd, dollar_gdp_change_pct, dollar_gdp_change_log_points, real_growth_log_points, deflator_change_log_points, exchange_rate_change_log_points]
  oecd-productivity-comparison: [period, reference_area_code, reference_area_name, reference_area_kind, gdp_per_capita_ppp_current_usd, gdp_per_capita_ppp_constant_2020_usd, gdp_volume_growth_pct, gdp_per_hour_ppp_current_usd, gdp_per_hour_ppp_constant_2020_usd, hours_per_worker, employment_per_capita, labour_input_is_plausible]
  world-demography-age-structure: [period, iso3_code, series_kind, share_of_population_pct]
