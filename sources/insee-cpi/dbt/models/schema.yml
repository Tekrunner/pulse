version: 2
models:
  - name: stg_insee_cpi_landing
    description: Faithful string-valued provider landing data.
  - name: insee_cpi_monthly
    description: Wide monthly INSEE CPI Base-2025 analytical dataset.
    columns:
      - {name: period, description: First day of represented month., data_tests: [not_null, unique]}
      - {name: cpi_index, description: CPI level Base 2025., data_tests: [not_null]}
      - {name: monthly_change_pct, description: Provider monthly percentage change., data_tests: [not_null]}
      - {name: annual_change_pct, description: Provider annual percentage change., data_tests: [not_null]}
  - name: insee_cpi_category_analysis
    description: Monthly CPI category analysis with annual basket-weight context.
    columns:
      - {name: period, description: First day of represented month., data_tests: [not_null, unique]}
      - {name: food_index, description: Food CPI level., data_tests: [not_null]}
      - {name: energy_index, description: Energy CPI level., data_tests: [not_null]}
      - {name: actual_rent_index, description: Actual rents paid CPI level., data_tests: [not_null]}
