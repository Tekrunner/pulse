<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #161826; color: #e9e9ed;
    font: 15px/1.6 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #b5abfc; } a:hover { color: #d2cefd; }
  h1, h2, h3 { margin: 0; font-weight: 500; }
  h1 { font-size: 40px; line-height: 1.1; letter-spacing: -.015em; max-width: 22ch; }
  h2 { font-size: 25px; letter-spacing: -.015em; }
  h3 { font-size: 20px; }
  p { margin: 0; }
  .eyebrow { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #b5abfc; }
  .standfirst { max-width: 62ch; color: #cfd3e5; font-size: 16px; }
  .muted { color: #b2b6ca; font-size: 13px; }
  .tiny { color: #9397ab; font-size: 12px; }
  figure { margin: 0; padding: 16.8px; border-radius: 8px; background: #232532;
    box-shadow: 0 0 0 1px #3f424d; display: flex; flex-direction: column; gap: 8.4px; }
  figcaption { display: flex; flex-direction: column; gap: 2.8px; }
  figcaption p { max-width: 74ch; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: .45rem; border-bottom: 1px solid #3f424d;
    font-variant-numeric: tabular-nums; }
  th { color: #b2b6ca; font-weight: 500; }
  td.n, th.n { text-align: right; }
  .legend { display: flex; flex-wrap: wrap; gap: 5.6px 16.8px; font-size: 12px; color: #cfd3e5; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 3px; border-radius: 2px; flex: none; }
  .provenance { color: #9397ab; font-size: 12px; }

  .caution { display: flex; gap: 8px; padding: 8.4px 11.2px; border-radius: 8px;
    background: #2a2418; box-shadow: inset 3px 0 0 #fab219; font-size: 12.5px; color: #f0e3c8; }
  .caution b { color: #fff2d8; }
  fieldset { min-width: 0; }
</style>
</helmet>
<div style="width: 1180px; padding: 22.4px 16.8px 44px; display: flex; flex-direction: column; gap: 22.4px">
<header style="display:flex;flex-direction:column;gap:5.6px">
  <p class="eyebrow">Section · International standing</p>
  <h2>How France compares</h2>
  <p class="standfirst" style="font-size:15px">Harmonised OECD rates, which are adjusted for
    comparability and so can differ from the number each country announces at home. Read this
    section for <i>position</i>, not for France's headline.</p>
</header>

<figure>
  <figcaption>
    <h3>Unemployment rate, OECD harmonised, monthly</h3>
    <p>France is fixed in the chart and cannot be removed; every other country keeps its colour for
      as long as it is selected, so removing one never repaints the others.</p>
  </figcaption>

  <div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:11.2px;padding:11.2px;
    border-radius:8px;background:#161826;box-shadow:0 0 0 1px #3f424d">
    <fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:5.6px;flex:1 1 320px">
      <legend style="padding:0;font-size:12px;color:#b2b6ca">Comparators &mdash; {{capacity}}</legend>
      <div style="display:flex;flex-wrap:wrap;gap:5.6px">
        <sc-for list="{{lines}}" as="line" hint-placeholder-count="5">
          <span style="display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 6px 0 10px;
            border:1px solid #595d6c;border-radius:8px;font-size:13px">
            <i style="width:14px;height:3px;border-radius:2px;background:{{line.colour}}"></i>
            {{line.name}}
            <sc-if value="{{line.removable}}" hint-placeholder-val="{{true}}">
              <button type="button" onClick="{{line.remove}}" aria-label="Remove comparator"
                style="min-height:32px;width:32px;padding:0;border:0;background:transparent;
                color:#b2b6ca;font-size:16px;line-height:1;cursor:pointer">&times;</button>
            </sc-if>
          </span>
        </sc-for>
      </div>
    </fieldset>
    <fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:5.6px">
      <legend style="padding:0;font-size:12px;color:#b2b6ca">Add an OECD member or aggregate</legend>
      <select onChange="{{onPick}}" value="{{addValue}}" aria-label="Add a comparator"
        style="min-height:44px;min-width:230px;padding:0 10px;border:1px solid #595d6c;border-radius:8px;
        background:#232532;color:#e9e9ed;font:inherit">
        <option value="">Choose a country…</option>
        <sc-for list="{{options}}" as="option" hint-placeholder-count="3">
          <option value="{{option.code}}">{{option.name}}</option>
        </sc-for>
      </select>
    </fieldset>
  </div>

  <sc-if value="{{full}}" hint-placeholder-val="{{false}}">
    <p class="caution"><span><b>Eight series is the limit.</b> Past eight the palette runs out of
      colours a colour-blind reader can separate, so adding a ninth is refused rather than served
      with a colour that lies. Remove one to add another.</span></p>
  </sc-if>

  <svg viewBox="0 0 {{W}} {{H}}" width="100%" height="300" role="img"
    aria-label="OECD harmonised monthly unemployment rate for the selected countries. Values are listed in the table below.">
    <title>OECD harmonised unemployment rate, selected countries</title>
    <sc-for list="{{gridRows}}" as="row" hint-placeholder-count="7">
      <line x1="46" x2="600" y1="{{row.y}}" y2="{{row.y}}" stroke="rgba(233,233,237,.10)" stroke-width="1" />
      <text x="38" y="{{row.y}}" dy="4" text-anchor="end" fill="#9397ab" font-size="11"
        style="font-variant-numeric:tabular-nums">{{row.label}}</text>
    </sc-for>
    <sc-for list="{{ticks}}" as="tick" hint-placeholder-count="5">
      <text x="{{tick.x}}" y="292" text-anchor="middle" fill="#9397ab" font-size="11">{{tick.label}}</text>
    </sc-for>
    <sc-for list="{{lines}}" as="line" hint-placeholder-count="5">
      <polyline points="{{line.path}}" fill="none" stroke="{{line.colour}}"
        stroke-width="{{line.width}}" stroke-linejoin="round" stroke-linecap="round" />
      <circle cx="{{line.endX}}" cy="{{line.endY}}" r="4" fill="{{line.colour}}"
        stroke="#232532" stroke-width="2" />
      <text x="{{line.labelX}}" y="{{line.labelY}}" fill="#e9e9ed" font-size="12"
        font-weight="500">{{line.name}} {{line.rate}}%</text>
    </sc-for>
  </svg>

  <p class="caution"><span><b>The lines do not all end in the same month.</b> Each country is drawn
    to its own latest published month and direct-labelled with it, rather than every line being cut
    back to the slowest. The United Kingdom's rolling-quarter survey runs about three months behind
    the others, so its line stops earlier — that is the provider's calendar, not a gap in the
    data.</span></p>

  <table>
    <caption class="tiny" style="text-align:left;padding:.45rem 0">Selected comparators, each at its
      own latest published month</caption>
    <thead><tr><th scope="col">Country</th><th scope="col">Code</th><th scope="col" class="n">Rate</th>
      <th scope="col">Latest month</th><th scope="col">Publication edge</th></tr></thead>
    <tbody>
      <sc-for list="{{tableRows}}" as="row" hint-placeholder-count="5">
        <tr><th scope="row"><span style="display:inline-flex;align-items:center;gap:6px">
          <i style="width:14px;height:3px;border-radius:2px;background:{{row.colour}}"></i>
          {{row.name}}</span></th>
          <td>{{row.code}}</td><td class="n">{{row.rate}}%</td><td>{{row.period}}</td>
          <td>{{row.note}}</td></tr>
      </sc-for>
    </tbody>
  </table>

  <div style="padding:11.2px;border-radius:8px;background:#161826">
    <p class="tiny" style="color:#cfd3e5"><b style="color:#e9e9ed">Two OECD members are not in this
      series.</b> Switzerland and New Zealand publish no monthly unemployment rate through this OECD dataflow.
      They stay in the list and are shown like this rather than disappearing:</p>
    <div style="display:flex;flex-wrap:wrap;gap:5.6px;margin-top:8.4px">
      <sc-for list="{{missing}}" as="row" hint-placeholder-count="2">
        <span style="display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;
          border:1px dashed #595d6c;border-radius:8px;font-size:13px;color:#b2b6ca">
          <svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true">
            <circle cx="6.5" cy="6.5" r="5.6" fill="none" stroke="#9397ab" stroke-width="1.2"/>
            <path d="M3 10 10 3" stroke="#9397ab" stroke-width="1.2"/></svg>
          {{row.name}} — not published monthly</span>
      </sc-for>
    </div>
    <p class="tiny" style="margin-top:8.4px">Both appear in the participation comparison below, which
      draws on the OECD's quarterly series.</p>
  </div>

  <p class="provenance">Source: OECD, Monthly unemployment rates · CC BY 4.0 ·
    This is an adaptation of an original work by the OECD.</p>
</figure>

    const ticks = DATA.periods
      .map((period, index) => ({ index, label: DATA.labels[index] }))
      .filter((tick) => tick.index % 6 === 0 || tick.index === DATA.periods.length - 1)
      .map((tick) => ({ ...tick, x: x(tick.index), key: `t${tick.index}` }));

    const lines = active.map((code) => {
      const entry = DATA.series[code];
      const points = entry.points
        .map(([period, rate]) => [DATA.periods.indexOf(period), rate])
        .filter(([index]) => index >= 0);
      const last = points[points.length - 1];
      const trailing = last[0] < DATA.periods.length - 1;
      return {
        code,
        key: code,
        name: entry.name,
        colour: this.colourFor(code),
        path: points.map(([index, rate]) => `${x(index).toFixed(1)},${y(rate).toFixed(1)}`).join(" "),
        endX: x(last[0]),
        endY: y(last[1]),
        labelX: x(last[0]) + 9,
        labelY: y(last[1]) + 4,
        rate: last[1].toFixed(1),
        period: DATA.labels[last[0]],
        trailing,
        note: trailing ? `ends ${DATA.labels[last[0]]}` : "",
        width: code === "FRA" ? 3 : 2,
        removable: code !== "FRA",
        remove: () => this.remove(code),
      };
    });

    const chosen = new Set(this.state.selected);
    const options = DATA.catalogue.filter((row) => !chosen.has(row.code));
    const full = this.freeSlot() < 0;

    return {
      W, H, lo, hi,
      gridRows, ticks, lines,
      options,
      full,
      capacity: `${active.length} of ${DATA.slots.length} series`,
      addValue: this.state.adding,
      onPick: (event) => this.add(event.target.value),
      missing: DATA.missing.map((row) => ({ ...row, key: row.code })),
      surface: DATA.surface,
      ink: DATA.ink,
      muted: DATA.muted,
      grid: DATA.grid,
      tableRows: lines.map((line) => ({
        key: line.code,
        name: line.name,
        code: line.code,
        rate: line.rate,
        period: line.period,
        colour: line.colour,
        note: line.trailing ? "behind the edge" : "at the edge",
      })),
    };
  }
}

</script>
