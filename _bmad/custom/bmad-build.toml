[workflow]

activation_steps_append = [
  """
Quota guard for review: store complete diffs in a temporary file and inspect changed files selectively. Do not print generated lockfile contents into model context; validate lockfiles through frozen installs and inspect only dependency-manifest changes.
Use the repository verification ladder from AGENTS.md: focused tests during implementation, then affected subsystem tests after stabilization, then one `uv run --no-sync pulse verify` after the final code change and consolidated review fixes. `pulse verify` already runs the full Python and frontend suites; never run those full suites immediately before or after it. Rerun the aggregate gate only after failure or a subsequent invalidating change.
"""
]

persistent_facts = [
  "file:{project-root}/AGENTS.md",
]

[[workflow.review_layers]]
id = "blind-hunter"
name = "Integrated Harness Review"
instruction = """
Review the current change directly in this primary session. Do not spawn subagents.

Inspect the approved spec and changed source, configuration, and tests. Report only actionable correctness, security, specification, regression, or meaningful verification findings. Do not manufacture a minimum number of findings; omit style-only and speculative suggestions.

Use these findings as the review layer result for normal BMAD classification and remediation.
"""

[[workflow.review_layers]]
id = "edge-case-hunter"
name = "Edge Case Hunter"
instruction = ""

[[workflow.review_layers]]
id = "verification-gap"
name = "Verification Gap Reviewer"
instruction = ""

[[workflow.oneshot_review_layers]]
id = "blind-hunter"
name = "Integrated Harness Review"
instruction = """
Review the changed files directly in this primary session. Do not spawn subagents. Report only actionable correctness, security, contract, regression, or meaningful verification findings. Omit style-only and speculative suggestions.
"""
