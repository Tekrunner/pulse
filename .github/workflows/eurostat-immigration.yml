name: Refresh Eurostat immigration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 8 4,5,6 *"

permissions:
  contents: write

concurrency:
  group: pulse-repository-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false
      - run: git lfs pull --include="snapshots/public/eurostat-immigration/**" --exclude=""
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.13"
      - run: uv sync --frozen
      - id: refresh
        continue-on-error: true
        run: uv run --no-sync pulse source refresh eurostat-immigration --live --logical-run-key "${{ github.run_id }}"
      - run: uv run --no-sync pulse status
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --no-sync pulse source stage-publication eurostat-immigration
          if ! git diff --cached --quiet; then
            git commit -m "data(eurostat-immigration): refresh public pipeline"
            git push origin HEAD:main
          fi
      - if: always()
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: test "$REFRESH_OUTCOME" = success
