name: Publish verified public site

on:
  push:
    branches: [main]
  # A refresh pushes with GITHUB_TOKEN, which never triggers push workflows,
  # so each source workflow is listed here instead. Any conclusion deploys:
  # a failed refresh still commits the status the homepage reports.
  workflow_run:
    workflows:
      - "Refresh Eurostat emigration"
      - "Refresh Eurostat immigration"
      - "Refresh Eurostat regional GDP"
      - "Refresh IGN departement boundaries"
      - "Refresh INSEE CPI"
      - "Refresh INSEE annual national accounts"
      - "Refresh INSEE localised unemployment rates"
      - "Refresh INSEE quarterly ILO labour-market indicators"
      - "Refresh INSEE quarterly national accounts GDP"
      - "Refresh OECD Productivity Database"
      - "Refresh OECD monthly unemployment rates"
      - "Refresh OECD quarterly labour force participation rates"
      - "Refresh UN WPP demographic indicators"
      - "Refresh UN WPP population by age"
      - "Refresh UN WPP projection scenarios"
      - "Refresh WHO healthy life expectancy"
      - "Refresh World Bank WDI GDP indicators"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pulse-pages
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run --no-sync pulse verify --repository-only
      - name: Confirm verification leaves the checkout clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Verify frontend contracts
        run: npm run verify:contracts
      - name: Build and verify the immutable public artifact
        run: uv run --no-sync pulse public build --output dist
      - name: Verify production behavior, accessibility, failures, and performance
        run: npm run public:verify
      - name: Confirm the build did not mutate the checkout
        run: git diff --exit-code
      - uses: actions/configure-pages@v5
      - name: Upload the verified bytes
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [repository, artifact]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the uploaded bytes
        id: deployment
        uses: actions/deploy-pages@v4
