name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: uv run pulse verify
      - name: Assert verification leaves worktree clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
