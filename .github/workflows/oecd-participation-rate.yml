name: Refresh OECD quarterly labour force participation rates

on:
  workflow_dispatch:
  schedule:
    # Quarters end 31 Mar, 30 Jun, 30 Sep and 31 Dec, and the OECD advances the
    # edge about 72 days later. The 25th of Jan, Apr, Jul and Oct is +86 to +87
    # days after the quarter end: after that advance and before the declared
    # deadline plus grace expires at +94 days. 10:00 UTC is after the Paris
    # publication under both CET and CEST.
    - cron: "0 10 25 1,4,7,10 *"

permissions:
  contents: write

concurrency:
  group: pulse-repository-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false
      - run: git lfs pull --include="snapshots/public/oecd-participation-rate/**" --exclude=""
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.13"
      - run: uv sync --frozen
      - id: refresh
        continue-on-error: true
        run: uv run --no-sync pulse source refresh oecd-participation-rate --live --logical-run-key "${{ github.run_id }}"
      - run: uv run --no-sync pulse status
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --no-sync pulse source stage-publication oecd-participation-rate
          if ! git diff --cached --quiet; then
            git commit -m "data(oecd-participation-rate): refresh public pipeline"
            git push origin HEAD:main
          fi
      - if: always()
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: test "$REFRESH_OUTCOME" = success
