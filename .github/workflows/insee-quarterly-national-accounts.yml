name: Refresh INSEE quarterly national accounts GDP

on:
  workflow_dispatch:
  schedule:
    # INSEE publishes the first estimate of a quarter about 30 days after it
    # ends and the detailed results about a month later, at 07:30
    # Europe/Paris. The 2nd of each month at 08:00 UTC follows each first
    # estimate (Feb, May, Aug, Nov) inside the 31 + 7 day window and each set
    # of detailed results (Mar, Jun, Sep, Dec); other months are no-ops.
    - cron: "0 8 2 * *"

permissions:
  contents: write

concurrency:
  group: pulse-repository-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false
      - run: git lfs pull --include="snapshots/public/insee-quarterly-national-accounts/**" --exclude=""
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.13"
      - run: uv sync --frozen
      - id: refresh
        continue-on-error: true
        run: uv run --no-sync pulse source refresh insee-quarterly-national-accounts --live --logical-run-key "${{ github.run_id }}"
      - run: uv run --no-sync pulse status
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --no-sync pulse source stage-publication insee-quarterly-national-accounts
          if ! git diff --cached --quiet; then
            git commit -m "data(insee-quarterly-national-accounts): refresh public pipeline"
            git push origin HEAD:main
          fi
      - if: always()
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: test "$REFRESH_OUTCOME" = success
