name: Refresh OECD Productivity Database

on:
  workflow_dispatch:
  schedule:
    # The OECD updates the database on a rolling basis with no calendar. The
    # requester chose, on 2026-09-23, a quarterly refresh and a deadline of
    # 30 September for the previous year; the 5 October run falls inside the
    # 30-day grace window. 10:00 UTC is after the Paris working morning.
    - cron: "0 10 5 1,4,7,10 *"

permissions:
  contents: write

concurrency:
  group: pulse-repository-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false
      - run: git lfs pull --include="snapshots/public/oecd-productivity-database/**" --exclude=""
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.13"
      - run: uv sync --frozen
      - id: refresh
        continue-on-error: true
        run: uv run --no-sync pulse source refresh oecd-productivity-database --live --logical-run-key "${{ github.run_id }}"
      - run: uv run --no-sync pulse status
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --no-sync pulse source stage-publication oecd-productivity-database
          if ! git diff --cached --quiet; then
            git commit -m "data(oecd-productivity-database): refresh public pipeline"
            git push origin HEAD:main
          fi
      - if: always()
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: test "$REFRESH_OUTCOME" = success
