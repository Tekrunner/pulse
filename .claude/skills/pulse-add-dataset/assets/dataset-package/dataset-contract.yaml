contract_version: 1.1.0
model:
  name: example_dataset
  description: Typed example observations derived from the declared snapshot.
columns:
  - name: period
    type: DATE
    description: First day of the represented month.
  - name: example_value
    type: DECIMAL(18,2)
    description: Example value for the represented month.
indicators:
  - column: example_value
    definition: The source value typed as a decimal without further reinterpretation.
    unit: Example units
    source: Example provider field value
    licence: Example open licence
    attribution: "Source: Example provider."
questions:
  - id: example-value-over-time
    question: How has the example value changed over time?
    derivation: Select the typed provider value by represented month.
    columns: [period, example_value]
temporal:
  grain: month
  period_column: period
  meaning: Each period is the first day of the provider's represented calendar month.
validations:
  - name: unique-period
    description: There is exactly one observation for each represented month.
    columns: [period]
  - name: required-values
    description: Period and example value are never null.
    columns: [period, example_value]
