contract_version: 1.1.0
model:
  name: french_labour_market_quarterly
  description: One row per quarter carrying the published INSEE ILO labour-market indicators for France
    including Mayotte, seasonally adjusted. Every value is published by INSEE; nothing here is computed
    from anything else.
columns:
- name: period
  type: DATE
  description: First day of the quarter the observation describes.
- name: unemployment_rate_pct
  type: DECIMAL(10,1)
  description: ILO unemployed people as a percentage of the labour force, all ages, both sexes.
- name: unemployment_rate_under_25_pct
  type: DECIMAL(10,1)
  description: ILO unemployed people aged under 25 as a percentage of the labour force of that age.
- name: unemployment_rate_25_to_49_pct
  type: DECIMAL(10,1)
  description: ILO unemployed people aged 25 to 49 as a percentage of the labour force of that age.
- name: unemployment_rate_50_and_over_pct
  type: DECIMAL(10,1)
  description: ILO unemployed people aged 50 or over as a percentage of the labour force of that age.
- name: unemployment_rate_men_pct
  type: DECIMAL(10,1)
  description: ILO unemployed men as a percentage of the male labour force.
- name: unemployment_rate_women_pct
  type: DECIMAL(10,1)
  description: ILO unemployed women as a percentage of the female labour force.
- name: unemployed_thousands
  type: DECIMAL(10,1)
  description: Number of ILO unemployed people, all ages, both sexes.
- name: unemployed_under_25_thousands
  type: DECIMAL(10,1)
  description: Number of ILO unemployed people aged under 25.
- name: unemployed_25_to_49_thousands
  type: DECIMAL(10,1)
  description: Number of ILO unemployed people aged 25 to 49.
- name: unemployed_50_and_over_thousands
  type: DECIMAL(10,1)
  description: Number of ILO unemployed people aged 50 or over.
- name: unemployed_men_thousands
  type: DECIMAL(10,1)
  description: Number of ILO unemployed men.
- name: unemployed_women_thousands
  type: DECIMAL(10,1)
  description: Number of ILO unemployed women.
- name: long_term_unemployed_thousands
  type: DECIMAL(10,1)
  description: Number of ILO unemployed people who have been looking for work for a year or more.
- name: long_term_unemployment_rate_pct
  type: DECIMAL(10,1)
  description: Long-term ILO unemployed people as a percentage of the labour force.
- name: halo_thousands
  type: DECIMAL(10,1)
  description: 'Number of people in the halo around unemployment: inactive people who want a job but do
    not meet both ILO conditions of availability and active search, all ages.'
- name: halo_15_to_64_thousands
  type: DECIMAL(10,1)
  description: Number of people aged 15 to 64 in the halo around unemployment.
- name: halo_share_of_population_15_to_64_pct
  type: DECIMAL(10,1)
  description: People aged 15 to 64 in the halo around unemployment as a percentage of the population
    of that age. The denominator is the population, not the labour force, because people in the halo are
    by definition outside the labour force.
- name: underemployed_thousands
  type: DECIMAL(10,1)
  description: 'Number of employed people in a situation of underemployment: part-time workers who want
    to work more hours and are available to do so, plus people who involuntarily worked less than usual.'
- name: underemployment_rate_pct
  type: DECIMAL(10,1)
  description: Underemployed people as a percentage of employment. The denominator is employment, not
    the labour force, because underemployment is a condition of people who are in work.
- name: participation_rate_pct
  type: DECIMAL(10,1)
  description: 'ILO labour force participation (activity) rate: people in the labour force as a percentage
    of the corresponding population, all ages, both sexes. This is the same 15-or-over basis the OECD
    publishes, so it is the French series to place beside oecd-participation-comparison. The two still
    differ slightly after OECD harmonisation: across the 94 shared quarters the gap reaches 0.7 points
    and averages 0.49.'
- name: participation_rate_men_pct
  type: DECIMAL(10,1)
  description: ILO labour force participation rate, men, all ages.
- name: participation_rate_women_pct
  type: DECIMAL(10,1)
  description: ILO labour force participation rate, women, all ages.
- name: participation_rate_15_to_64_pct
  type: DECIMAL(10,1)
  description: 'ILO labour force participation rate for people aged 15 to 64, both sexes. This is a NARROWER
    base than the all-ages rate: it excludes the retired population, so it runs roughly 18 points higher.
    It is NOT the basis the OECD publishes; the all-ages rate is.'
- name: participation_rate_men_15_to_64_pct
  type: DECIMAL(10,1)
  description: ILO labour force participation rate for men aged 15 to 64.
- name: participation_rate_women_15_to_64_pct
  type: DECIMAL(10,1)
  description: ILO labour force participation rate for women aged 15 to 64.
