questions:
- id: headline-unemployment-over-time
  question: How many people in France are unemployed on the ILO definition, and what share of the labour
    force is that?
  derivation: Select the published ILO unemployment rate and the published count of unemployed people
    by quarter. Neither is derived from the other.
  columns:
  - period
  - unemployment_rate_pct
  - unemployed_thousands
- id: unemployment-by-age
  question: How far apart are the unemployment rates of under-25s, 25-to-49-year-olds and people aged
    50 or over?
  derivation: Select the three published age-band unemployment rates and their matching counts by quarter.
    The bands partition the labour force, so the counts sum to the total.
  columns:
  - period
  - unemployment_rate_under_25_pct
  - unemployment_rate_25_to_49_pct
  - unemployment_rate_50_and_over_pct
  - unemployed_under_25_thousands
  - unemployed_25_to_49_thousands
  - unemployed_50_and_over_thousands
- id: labour-market-slack-composition
  question: Beyond headline ILO unemployment, how large are long-term unemployment, the halo around unemployment
    and underemployment?
  derivation: 'Select each published slack measure with both its count and its own published rate. The
    rates are NOT comparable with one another: unemployment and long-term unemployment are shares of the
    labour force, the halo is a share of the population, and underemployment is a share of employment.'
  columns:
  - period
  - unemployed_thousands
  - unemployment_rate_pct
  - long_term_unemployed_thousands
  - long_term_unemployment_rate_pct
  - halo_15_to_64_thousands
  - halo_share_of_population_15_to_64_pct
  - underemployed_thousands
  - underemployment_rate_pct
- id: participation-by-sex
  question: What share of the population takes part in the labour market, and how far apart are men and
    women?
  derivation: Select the published activity rate for both sexes together and for each sex, on both the
    all-ages and the 15-to-64 basis. The ALL-AGES basis is the one that matches the OECD's 15-or-over
    participation rate; the 15-to-64 basis is a narrower population and must never be placed on the same
    axis as an OECD figure.
  columns:
  - period
  - participation_rate_pct
  - participation_rate_men_pct
  - participation_rate_women_pct
  - participation_rate_15_to_64_pct
  - participation_rate_men_15_to_64_pct
  - participation_rate_women_15_to_64_pct
- id: unemployment-by-sex
  question: Are men and women unemployed at different rates?
  derivation: Select the published unemployment rate and count for each sex by quarter.
  columns:
  - period
  - unemployment_rate_men_pct
  - unemployment_rate_women_pct
  - unemployed_men_thousands
  - unemployed_women_thousands
temporal:
  grain: quarter
  period_column: period
  meaning: 'Each period is the first day of the calendar quarter the observation describes, from the provider''s
    YYYY-Qn period. Only quarters carrying every declared indicator are published, which begins at 2003-Q1:
    the unemployment counts reach back to 1975 but the rates, halo, underemployment and activity series
    do not.'
validations:
- name: unique-period
  description: There is exactly one row for each quarter.
  columns:
  - period
- name: required-values
  description: Every declared indicator is present in every published quarter.
  columns:
  - period
  - unemployment_rate_pct
  - unemployment_rate_under_25_pct
  - unemployment_rate_25_to_49_pct
  - unemployment_rate_50_and_over_pct
  - unemployment_rate_men_pct
  - unemployment_rate_women_pct
  - unemployed_thousands
  - unemployed_under_25_thousands
  - unemployed_25_to_49_thousands
  - unemployed_50_and_over_thousands
  - unemployed_men_thousands
  - unemployed_women_thousands
  - long_term_unemployed_thousands
  - long_term_unemployment_rate_pct
  - halo_thousands
  - halo_15_to_64_thousands
  - halo_share_of_population_15_to_64_pct
  - underemployed_thousands
  - underemployment_rate_pct
  - participation_rate_pct
  - participation_rate_men_pct
  - participation_rate_women_pct
  - participation_rate_15_to_64_pct
  - participation_rate_men_15_to_64_pct
  - participation_rate_women_15_to_64_pct
- name: rates-within-zero-and-one-hundred
  description: Every percentage lies between 0 and 100.
  columns:
  - unemployment_rate_pct
  - unemployment_rate_under_25_pct
  - unemployment_rate_25_to_49_pct
  - unemployment_rate_50_and_over_pct
  - unemployment_rate_men_pct
  - unemployment_rate_women_pct
  - long_term_unemployment_rate_pct
  - halo_share_of_population_15_to_64_pct
  - underemployment_rate_pct
  - participation_rate_pct
  - participation_rate_men_pct
  - participation_rate_women_pct
  - participation_rate_15_to_64_pct
  - participation_rate_men_15_to_64_pct
  - participation_rate_women_15_to_64_pct
- name: counts-are-not-negative
  description: Every headcount is zero or greater.
  columns:
  - unemployed_thousands
  - unemployed_under_25_thousands
  - unemployed_25_to_49_thousands
  - unemployed_50_and_over_thousands
  - unemployed_men_thousands
  - unemployed_women_thousands
  - long_term_unemployed_thousands
  - halo_thousands
  - halo_15_to_64_thousands
  - underemployed_thousands
- name: age-bands-sum-to-the-total
  description: The three age-band unemployment counts sum to the published total, within the rounding
    of one decimal place.
  columns:
  - unemployed_thousands
  - unemployed_under_25_thousands
  - unemployed_25_to_49_thousands
  - unemployed_50_and_over_thousands
- name: sexes-sum-to-the-total
  description: The male and female unemployment counts sum to the published total, within the rounding
    of one decimal place.
  columns:
  - unemployed_thousands
  - unemployed_men_thousands
  - unemployed_women_thousands
- name: long-term-unemployment-does-not-exceed-unemployment
  description: Long-term unemployed people are a subset of the unemployed.
  columns:
  - long_term_unemployed_thousands
  - unemployed_thousands
