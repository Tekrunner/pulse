contract_version: 1.1.0
model:
  name: world_demography_scenarios
  description: >-
    One row per location, projected year and published projection scenario, for
    the world total and every country or area the provider publishes. Every row
    is a projection; the estimated period is not part of this table.
columns:
  - name: period
    type: DATE
    description: First day of the represented calendar year.
  - name: location_id
    type: INTEGER
    description: The provider's numeric location code, which follows ISO 3166-1 numeric for countries and areas and is 900 for the world total.
  - name: iso3_code
    type: VARCHAR
    description: ISO 3166-1 alpha-3 code for the location, or null for the world total, for which the provider publishes none.
  - name: location_name
    type: VARCHAR
    description: The provider's name for the location.
  - name: location_kind
    type: VARCHAR
    description: Whether the row is the provider's world aggregate or one of its countries and areas; one of 'world' or 'country'.
  - name: scenario_id
    type: INTEGER
    description: The provider's numeric code for the projection scenario.
  - name: scenario
    type: VARCHAR
    description: The provider's name for the projection scenario, such as 'High', 'Low', 'Zero migration' or 'Upper 95 PI'.
  - name: scenario_kind
    type: VARCHAR
    description: >-
      Which kind of projection the scenario is; one of 'deterministic' for a
      path produced by fixing an assumption and running it forward, or
      'probabilistic' for a summary of the provider's probabilistic projection.
      The two are not alternatives of the same kind and must not be read as one
      set of equally likely futures.
  - name: population_thousands
    type: DECIMAL(18,3)
    description: Projected population on 1 July of the year under this scenario, in thousands of people; null where the scenario publishes no population.
  - name: population_growth_rate_pct
    type: DECIMAL(9,4)
    description: Projected annual rate of population change under this scenario, in per cent per year; null where the scenario publishes none.
  - name: natural_change_thousands
    type: DECIMAL(18,3)
    description: Projected births minus deaths over the year under this scenario, in thousands of people; null where the scenario publishes none.
  - name: net_migration_thousands
    type: DECIMAL(18,3)
    description: Projected net number of migrants over the year under this scenario, in thousands of people; null where the scenario publishes none.
  - name: total_fertility_rate
    type: DECIMAL(9,4)
    description: Projected total fertility rate under this scenario, in live births per woman; null where the scenario publishes none.
  - name: life_expectancy_years
    type: DECIMAL(9,4)
    description: Projected life expectancy at birth for both sexes combined under this scenario, in years; null where the scenario publishes none.
  - name: median_age_years
    type: DECIMAL(9,4)
    description: Projected median age of the population on 1 July under this scenario, in years; null where the scenario publishes none. Under the probabilistic lower bounds the provider publishes values outside any age a population can have, including exactly zero, which are placeholders at the edge of its distribution rather than ages.
indicators:
  - column: population_thousands
    definition: The provider's projected population on 1 July under the named scenario, typed without further reinterpretation.
    unit: Thousands of people
    source: UN World Population Prospects 2024 other-scenarios indicator file, column TPopulation1July
    licence: Creative Commons Attribution 3.0 IGO (CC BY 3.0 IGO)
    attribution: "United Nations, Department of Economic and Social Affairs, Population Division (2024). World Population Prospects 2024, Online Edition."
  - column: population_growth_rate_pct
    definition: The provider's projected annual rate of population change under the named scenario.
    unit: Per cent per year
    source: UN World Population Prospects 2024 other-scenarios indicator file, column PopGrowthRate
    licence: Creative Commons Attribution 3.0 IGO (CC BY 3.0 IGO)
    attribution: "United Nations, Department of Economic and Social Affairs, Population Division (2024). World Population Prospects 2024, Online Edition."
  - column: natural_change_thousands
    definition: The provider's projected births minus deaths under the named scenario.
    unit: Thousands of people per year
    source: UN World Population Prospects 2024 other-scenarios indicator file, column NatChange
    licence: Creative Commons Attribution 3.0 IGO (CC BY 3.0 IGO)
    attribution: "United Nations, Department of Economic and Social Affairs, Population Division (2024). World Population Prospects 2024, Online Edition."
  - column: net_migration_thousands
    definition: The provider's projected net number of migrants under the named scenario. Two of the published scenarios set it to zero by construction.
    unit: Thousands of people per year
    source: UN World Population Prospects 2024 other-scenarios indicator file, column NetMigrations
    licence: Creative Commons Attribution 3.0 IGO (CC BY 3.0 IGO)
    attribution: "United Nations, Department of Economic and Social Affairs, Population Division (2024). World Population Prospects 2024, Online Edition."
  - column: total_fertility_rate
    definition: The provider's projected total fertility rate under the named scenario. Several scenarios are defined by what they assume about this measure.
    unit: Live births per woman
    source: UN World Population Prospects 2024 other-scenarios indicator file, column TFR
    licence: Creative Commons Attribution 3.0 IGO (CC BY 3.0 IGO)
    attribution: "United Nations, Department of Economic and Social Affairs, Population Division (2024). World Population Prospects 2024, Online Edition."
  - column: life_expectancy_years
    definition: The provider's projected life expectancy at birth for both sexes combined under the named scenario.
    unit: Years
    source: UN World Population Prospects 2024 other-scenarios indicator file, column LEx
    licence: Creative Commons Attribution 3.0 IGO (CC BY 3.0 IGO)
    attribution: "United Nations, Department of Economic and Social Affairs, Population Division (2024). World Population Prospects 2024, Online Edition."
  - column: median_age_years
    definition: The provider's projected median age of the population on 1 July under the named scenario.
    unit: Years
    source: UN World Population Prospects 2024 other-scenarios indicator file, column MedianAgePop
    licence: Creative Commons Attribution 3.0 IGO (CC BY 3.0 IGO)
    attribution: "United Nations, Department of Economic and Social Affairs, Population Division (2024). World Population Prospects 2024, Online Edition."
questions:
  - id: projected-population-range
    question: Across the scenarios the provider publishes, what range of populations does a location reach in each projected year?
    derivation: Select the projected 1 July population by location, year and scenario, for the scenarios that publish one.
    columns: [period, location_id, location_name, location_kind, scenario, population_thousands]
  - id: projected-growth-range
    question: How fast is a location's population projected to change under each scenario?
    derivation: Select the projected annual rate of population change by location, year and scenario.
    columns: [period, location_id, scenario, population_growth_rate_pct]
  - id: projected-components-range
    question: Under each scenario, how much of a location's projected change is natural change and how much is migration?
    derivation: Select the projected natural change and net migration by location, year and scenario.
    columns: [period, location_id, scenario, natural_change_thousands, net_migration_thousands]
  - id: projected-fertility-and-longevity-range
    question: What fertility rate and life expectancy does each scenario assume or produce for a location?
    derivation: Select the projected total fertility rate and life expectancy at birth by location, year and scenario.
    columns: [period, location_id, scenario, total_fertility_rate, life_expectancy_years]
  - id: which-scenarios-publish-what
    question: Which measures does each published scenario carry, and which kind of projection is it?
    derivation: Read the measure columns by scenario and its kind; a scenario that publishes a measure publishes it for every row it covers, and one that does not carries null throughout.
    columns: [scenario, scenario_kind, population_thousands, total_fertility_rate, life_expectancy_years, median_age_years]
temporal:
  grain: year
  period_column: period
  meaning: >-
    Each period is the first day of the calendar year the projection describes,
    from the provider's Time column. The grain is one row per period,
    location_id and scenario_id. Every row is a projection, so this table has no
    estimated period and cannot be read as a continuation of an observed series
    on its own: the estimates live in the sibling indicator table, and the first
    year here is the year after the estimates end. Stocks are projected for
    1 July and flows are totals over the calendar year. The panel is not
    rectangular across scenarios: seventeen scenarios cover the world total and
    every country or area, while the probabilistic 'Mean' is published for
    countries and areas only and carries the total fertility rate alone. The
    provider's own 1 January row for the year after the projection horizon is
    excluded, because it carries a population stock and none of this table's
    measures. The probabilistic summaries behave differently from the
    deterministic paths at their edges: a lower bound rounds a small country's
    population to zero at the far end of the projection and reports a median age
    no human population could have where it does, and on four rows it publishes
    a median age of exactly zero beside an ordinary population, which is a
    placeholder rather than an age. That is the published tail of a distribution
    rather than a defect, which is why scenario_kind exists and why physical
    ranges are asserted only of the deterministic scenarios. A consumer reading
    a median age from a probabilistic bound has to treat zero as no value.
validations:
  - name: one-row-per-location-year-and-scenario
    description: There is exactly one observation for each location, calendar year and scenario.
    columns: [period, location_id, scenario_id]
  - name: required-identity-is-never-null
    description: Period, location identity and scenario identity are never null, however sparse the measures are.
    columns: [period, location_id, location_name, location_kind, scenario_id, scenario, scenario_kind]
  - name: scenario-identity-is-one-to-one
    description: Each scenario name has exactly one provider code, each code exactly one name, and each scenario exactly one kind.
    columns: [scenario_id, scenario, scenario_kind]
  - name: only-the-world-total-lacks-an-iso3-code
    description: Every country or area carries an ISO 3166-1 alpha-3 code, and only the world total does not.
    columns: [iso3_code, location_kind]
  - name: every-scenario-covers-the-same-years
    description: No scenario stops short of or reaches beyond the projection period the others cover.
    columns: [period, scenario_id]
  - name: a-scenario-publishes-a-measure-throughout-or-not-at-all
    description: Where a scenario publishes a measure it publishes it for every row it covers, so a null marks a measure the scenario does not carry rather than a gap inside one it does.
    columns: [scenario_id, population_thousands, population_growth_rate_pct, natural_change_thousands, net_migration_thousands, total_fertility_rate, life_expectancy_years, median_age_years]
  - name: every-year-is-projected
    description: No row falls in the estimated period, which belongs to the sibling indicator table rather than to this one.
    columns: [period]
  - name: measures-lie-in-their-published-ranges
    description: >-
      Under the deterministic scenarios, projected populations are positive and
      fertility rates, life expectancies and median ages lie in ranges a human
      population can take. The probabilistic summaries are held only to
      non-negativity, because the edges of a distribution are not themselves
      populations.
    columns: [scenario_kind, population_thousands, total_fertility_rate, life_expectancy_years, median_age_years]
