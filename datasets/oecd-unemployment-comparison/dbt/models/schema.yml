version: 2
models:
  - name: oecd_unemployment_comparison
    columns:
      - name: period
        data_tests: [not_null]
      - name: reference_area_code
        data_tests: [not_null]
      - name: reference_area_name
        data_tests: [not_null]
      - name: reference_area_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [member, aggregate, non-member]
      - name: unemployment_rate_pct
        data_tests:
          - not_null
          - within_range:
              arguments:
                minimum: 0
                maximum: 100
