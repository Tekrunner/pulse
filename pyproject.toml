[project]
name = "pulse"
version = "0.1.0"
description = "Reproducible workspace for Pulse"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "dlt==1.30.0",
  "duckdb==1.5.5",
  "dbt-core==1.12.2",
  "dbt-duckdb==1.10.1",
]

[project.scripts]
pulse = "pulse.cli:main"

[dependency-groups]
dev = [
  "pytest==9.0.2",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runtime/pulse"]

[tool.uv]
required-version = ">=0.9.26"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
  "live: explicit network integration checks excluded from ordinary verification",
]
